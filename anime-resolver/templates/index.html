<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>NebulaStream — Anime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: rgba(20, 20, 30, 0.85);
            --accent-cyan: #00ffff;
            --accent-pink: #ff00ff;
            --accent-purple: #b300ff;
            --text: #e0e0ff;
            --text-secondary: #8090b0;
            --neon-glow-cyan: 0 0 10px rgba(0,255,255,0.6), 0 0 30px rgba(0,255,255,0.3);
            --neon-glow-pink: 0 0 10px rgba(255,0,255,0.6), 0 0 30px rgba(255,0,255,0.3);
            --border-neon: 1px solid rgba(0,255,255,0.3);
            --radius: 4px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,255,0.015) 2px, rgba(0,255,255,0.015) 4px),
                radial-gradient(circle at 50% 0%, rgba(180,0,255,0.1) 0%, transparent 50%);
        }

        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(10,10,20,0.9);
            backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 25px; height: 70px;
            border-bottom: 1px solid rgba(0,255,255,0.3);
            box-shadow: 0 0 20px rgba(0,255,255,0.15);
        }
        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem; font-weight: 900;
            color: var(--accent-cyan); text-decoration: none;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-cyan), 0 0 30px var(--accent-cyan);
            transition: text-shadow 0.3s;
        }
        .logo:hover { text-shadow: 0 0 20px var(--accent-pink), 0 0 50px var(--accent-pink); }
        .desktop-nav { display: flex; gap: 25px; }
        .desktop-nav a {
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-secondary); text-decoration: none;
            font-size: 1rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px;
            transition: color 0.2s, text-shadow 0.2s;
            position: relative;
        }
        .desktop-nav a::after {
            content: ''; position: absolute; bottom: -5px; left: 0;
            width: 0%; height: 2px; background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
            transition: width 0.3s;
        }
        .desktop-nav a:hover, .desktop-nav a.active {
            color: var(--accent-cyan); text-shadow: 0 0 8px var(--accent-cyan);
        }
        .desktop-nav a:hover::after, .desktop-nav a.active::after { width: 100%; }

        .mobile-menu-btn {
            display: none;
            background: none; border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan); font-size: 1.5rem; cursor: pointer;
            width: 40px; height: 40px; align-items: center; justify-content: center;
            border-radius: 0;
        }

        .mobile-nav-overlay {
            display: none;
            position: fixed; top: 70px; left: 0; right: 0; bottom: 0;
            background: rgba(10,10,20,0.95); backdrop-filter: blur(20px);
            z-index: 99; flex-direction: column; align-items: center; justify-content: center;
            gap: 25px;
        }
        .mobile-nav-overlay.active { display: flex; }
        .mobile-nav-overlay a {
            font-family: 'Rajdhani', sans-serif;
            color: var(--text); text-decoration: none;
            font-size: 1.5rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 2px;
            transition: color 0.2s, text-shadow 0.2s;
        }
        .mobile-nav-overlay a:hover, .mobile-nav-overlay a.active {
            color: var(--accent-cyan); text-shadow: 0 0 10px var(--accent-cyan);
        }

        .search-container {
            position: relative; display: flex; align-items: center; margin-left: 15px;
        }
        .search-container input {
            background: rgba(10,10,20,0.7);
            border: var(--border-neon); border-radius: 0;
            padding: 8px 18px; color: var(--accent-cyan); outline: none;
            width: 220px; font-size: 0.95rem; letter-spacing: 0.5px;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: 'Rajdhani', sans-serif;
        }
        .search-container input:focus {
            border-color: var(--accent-pink); box-shadow: var(--neon-glow-pink);
        }
        .search-container input::placeholder { color: rgba(0,255,255,0.4); }
        .search-results {
            position: absolute; top: 50px; left: 0; right: 0;
            background: rgba(10,10,20,0.95);
            border: var(--border-neon); border-radius: 0;
            max-height: 300px; overflow-y: auto; z-index: 200;
            display: none; backdrop-filter: blur(10px);
        }
        .search-results.active { display: block; }
        .search-result-item {
            padding: 10px 15px; cursor: pointer; display: flex; align-items: center; gap: 10px;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(0,255,255,0.2);
        }
        .search-result-item:hover { background: rgba(0,255,255,0.1); }
        .search-result-item img { width: 40px; height: 60px; object-fit: cover; border-radius: 0; border: 1px solid var(--accent-cyan); }

        .hero {
            position: relative; height: 85vh; margin-top: 70px; overflow: hidden;
            background: #000;
            border-bottom: 2px solid var(--accent-cyan);
            box-shadow: 0 0 30px rgba(0,255,255,0.2);
        }
        .hero-slide {
            position: absolute; inset: 0; background-size: cover; background-position: center 30%;
            opacity: 0; transition: opacity 1.2s ease-in-out;
            filter: brightness(0.7) contrast(1.1);
        }
        .hero-slide.active { opacity: 1; }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(10,10,20,0.95) 0%, transparent 50%),
                        repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,255,255,0.02) 3px, rgba(0,255,255,0.02) 6px);
        }
        .hero-content { position: absolute; bottom: 60px; left: 60px; max-width: 600px; z-index: 10; }
        .hero-content h1 {
            font-family: 'Orbitron', monospace;
            font-size: 3.2rem; font-weight: 900;
            margin-bottom: 15px;
            text-shadow: 0 0 20px var(--accent-cyan), 0 0 40px var(--accent-purple);
            letter-spacing: 2px;
        }
        .hero-content h1:hover {
            text-shadow: 2px 0 var(--accent-pink), -2px 0 var(--accent-cyan), 0 0 30px var(--accent-pink), 0 0 60px var(--accent-cyan);
            transform: skewX(-2deg); transition: 0.1s;
        }
        .hero-meta { display: flex; gap: 20px; color: #ccc; font-size: 1rem; margin-bottom: 20px; }
        .hero-desc {
            font-size: 1rem; color: #a0a0c0; margin-bottom: 25px; line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        .hero-buttons { display: flex; gap: 15px; }
        .btn {
            padding: 12px 30px; border-radius: 0; border: 1px solid var(--accent-cyan);
            font-size: 1rem; font-weight: 700; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            background: transparent; color: var(--accent-cyan);
            transition: all 0.3s; font-family: 'Orbitron', monospace;
            position: relative; overflow: hidden; z-index: 1;
        }
        .btn::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-purple));
            opacity: 0; transition: opacity 0.3s; z-index: -1;
        }
        .btn:hover::before { opacity: 1; }
        .btn:hover { color: #000; border-color: transparent; box-shadow: var(--neon-glow-cyan); }
        .btn-secondary {
            border-color: var(--accent-pink); color: var(--accent-pink);
        }
        .btn-secondary:hover::before { background: linear-gradient(45deg, var(--accent-pink), var(--accent-purple)); }

        .hero-nav { position: absolute; bottom: 40px; right: 60px; display: flex; gap: 10px; z-index: 10; }
        .hero-dot {
            width: 12px; height: 12px; border-radius: 0; background: rgba(0,255,255,0.3);
            cursor: pointer; transition: background 0.3s, box-shadow 0.3s;
        }
        .hero-dot.active { background: var(--accent-cyan); box-shadow: 0 0 10px var(--accent-cyan); }
        .hero-arrows { position: absolute; top: 50%; transform: translateY(-50%); z-index: 10;
            display: flex; justify-content: space-between; width: 100%; padding: 0 20px; pointer-events: none; }
        .hero-arrow {
            pointer-events: auto; background: rgba(0,0,0,0.6); border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan); font-size: 2rem;
            width: 50px; height: 80px; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .hero-arrow:hover { background: var(--accent-cyan); color: #000; box-shadow: var(--neon-glow-cyan); }

        .row-section { margin: 30px 30px; }
        .row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .row-header h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1.4rem; font-weight: 600;
            color: var(--accent-cyan); letter-spacing: 1px;
            text-shadow: 0 0 8px var(--accent-cyan);
        }
        .scroll-row {
            display: flex; gap: 18px; overflow-x: auto; padding-bottom: 12px;
            scroll-snap-type: x mandatory; scroll-behavior: smooth;
        }
        .scroll-row::-webkit-scrollbar { height: 4px; }
        .scroll-row::-webkit-scrollbar-thumb { background: var(--accent-cyan); box-shadow: 0 0 6px var(--accent-cyan); }

        .rec-scroll {
            display: flex; gap: 18px; overflow-x: auto; padding-bottom: 12px;
            scroll-snap-type: x mandatory; scroll-behavior: smooth;
        }
        .rec-scroll::-webkit-scrollbar { height: 4px; }
        .rec-scroll::-webkit-scrollbar-thumb { background: var(--accent-cyan); box-shadow: 0 0 6px var(--accent-cyan); }

        .card {
            min-width: 165px; max-width: 165px;
            background: var(--surface);
            backdrop-filter: blur(10px);
            border: var(--border-neon); border-radius: 0;
            overflow: hidden; cursor: pointer;
            transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
            flex-shrink: 0; scroll-snap-align: start;
            position: relative;
        }
        .card::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(0,255,255,0.15), transparent 50%);
            z-index: 1; pointer-events: none; opacity: 0; transition: opacity 0.3s;
        }
        .card:hover::before { opacity: 1; }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 0 20px rgba(0,255,255,0.4), 0 0 40px rgba(180,0,255,0.3);
            border-color: var(--accent-pink);
        }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .card .info { padding: 12px; position: relative; z-index: 2; }
        .card .title {
            font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: var(--text); text-shadow: 0 0 5px var(--accent-cyan);
        }
        .card .meta { font-size: 0.75rem; color: var(--text-secondary); margin-top: 5px; }

        .resume-btn {
            background: var(--accent-cyan); color: #000; border: none;
            padding: 6px 10px; font-family: 'Orbitron', monospace;
            font-size: 0.7rem; cursor: pointer; display: inline-block;
            margin-top: 8px; width: 100%; text-align: center; text-transform: uppercase;
        }

        .genre-grid { display: flex; flex-wrap: wrap; gap: 12px; padding: 20px; }
        .genre-btn {
            background: transparent; border: 1px solid var(--accent-cyan); color: var(--accent-cyan);
            padding: 10px 20px; border-radius: 0; cursor: pointer; font-size: 0.9rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s;
        }
        .genre-btn:hover { background: var(--accent-cyan); color: #000; box-shadow: var(--neon-glow-cyan); }

        .anime-details { padding: 100px 30px 30px; }
        .anime-banner {
            width: 100%; height: 350px; background-size: cover; background-position: center;
            border: 2px solid var(--accent-cyan); box-shadow: 0 0 30px rgba(0,255,255,0.3);
            position: relative; margin-bottom: 20px;
        }
        .anime-banner .overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(10,10,20,0.9) 0%, transparent 60%);
        }
        .anime-info { display: flex; gap: 30px; }
        .anime-poster { width: 200px; border: 2px solid var(--accent-pink); box-shadow: 0 0 20px rgba(255,0,255,0.3); }
        .anime-meta h1 {
            font-family: 'Orbitron', monospace; font-size: 2.2rem; margin-bottom: 10px;
            color: var(--accent-cyan); text-shadow: 0 0 10px var(--accent-cyan);
        }
        .stats { display: flex; gap: 20px; color: var(--text-secondary); margin-bottom: 15px; }
        .desc { line-height: 1.6; color: #ccc; }
        .anime-genres { display: flex; gap: 8px; flex-wrap: wrap; margin: 15px 0; }
        .anime-genre {
            background: rgba(0,255,255,0.1); border: 1px solid var(--accent-cyan);
            padding: 4px 12px; border-radius: 0; font-size: 0.8rem; text-transform: uppercase;
            color: var(--accent-cyan);
        }
        .ep-btn {
            background: transparent; border: 1px solid var(--accent-cyan); color: var(--accent-cyan);
            padding: 6px 14px; border-radius: 0; cursor: pointer; font-size: 0.8rem;
            font-weight: 600; transition: all 0.3s;
        }
        .ep-btn:hover, .ep-btn.active {
            background: var(--accent-cyan); color: #000; box-shadow: var(--neon-glow-cyan);
        }

        .player-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }
        .player-overlay.active { opacity: 1; pointer-events: auto; }
        .player-container {
            background: rgba(10,10,20,0.95); border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 40px rgba(0,255,255,0.5);
            width: 95%; max-width: 950px;
            max-height: 90vh; overflow-y: auto; padding: 25px; position: relative;
        }
        .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: var(--accent-cyan); font-size: 1.6rem; cursor: pointer; transition: text-shadow 0.3s; }
        .close-btn:hover { text-shadow: 0 0 10px var(--accent-cyan); }
        video { width: 100%; border-radius: 0; outline: none; border: 1px solid var(--accent-cyan); }
        .lang-btn {
            background: transparent; border: 1px solid var(--accent-cyan); color: var(--accent-cyan);
            padding: 6px 18px; border-radius: 0; cursor: pointer; font-weight: 600; text-transform: uppercase;
            transition: all 0.3s; font-family: 'Orbitron', monospace;
        }
        .lang-btn.active { background: var(--accent-cyan); color: #000; box-shadow: var(--neon-glow-cyan); }
        .skip-btn {
            background: transparent; border: 1px solid var(--accent-pink); color: var(--accent-pink);
            padding: 6px 14px; border-radius: 0; cursor: pointer; font-size: 0.8rem; text-transform: uppercase;
            transition: all 0.3s;
        }
        .skip-btn:hover { background: var(--accent-pink); color: #000; }
        .ep-nav { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; }
        .ep-nav button {
            background: transparent; border: 1px solid var(--accent-cyan); color: var(--accent-cyan);
            padding: 8px 18px; cursor: pointer; font-family: 'Orbitron', monospace; font-size: 0.9rem;
            transition: all 0.3s;
        }
        .ep-nav button:hover { background: var(--accent-cyan); color: #000; }
        .player-controls {
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
            gap: 10px; margin: 15px 0;
        }
        .episode-page-nav { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .episode-page-nav button {
            background: transparent; border: 1px solid var(--accent-cyan); color: var(--accent-cyan);
            padding: 6px 14px; cursor: pointer; font-size: 0.8rem; font-weight: 600;
            transition: all 0.3s;
        }
        .episode-page-nav button:hover { background: var(--accent-cyan); color: #000; }

        .audio-select { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .audio-select select {
            background: transparent; border: 1px solid var(--accent-cyan); color: var(--accent-cyan);
            padding: 4px 10px; font-family: 'Rajdhani', sans-serif;
        }

        .page-content { padding: 100px 30px 30px; }
        .load-more { text-align: center; margin: 20px 0; }
        .back-link {
            color: var(--accent-cyan); text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 15px;
            font-family: 'Orbitron', monospace; text-transform: uppercase; letter-spacing: 1px;
            transition: text-shadow 0.3s;
        }
        .back-link:hover { text-shadow: 0 0 10px var(--accent-cyan); }

        #scroll-top {
            position: fixed; bottom: 30px; right: 30px; z-index: 999;
            width: 50px; height: 50px; border-radius: 0; border: 1px solid var(--accent-cyan);
            background: rgba(10,10,20,0.8); color: var(--accent-cyan);
            font-size: 1.5rem; cursor: pointer; display: none;
            align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
            transition: all 0.3s; font-family: 'Orbitron', monospace;
        }
        #scroll-top:hover { background: var(--accent-cyan); color: #000; box-shadow: var(--neon-glow-cyan); }

        @media (max-width: 768px) {
            .navbar { flex-direction: row; padding: 0 15px; height: 70px; }
            .desktop-nav { display: none; }
            .mobile-menu-btn { display: flex; }
            .search-container { flex: 1; margin-left: 10px; }
            .search-container input { width: 100%; }
            .anime-details { padding: 100px 15px 20px; }
            .anime-info { flex-direction: column; }
            .anime-poster { width: 150px; }
            .hero { height: 50vh; margin-top: 70px; }
            .hero-content { left: 20px; bottom: 30px; }
            .hero-content h1 { font-size: 1.8rem; }
            .player-container { padding: 15px; }
            .player-controls { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <!-- Floating neon particles (optimized) -->
    <canvas id="particle-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none;"></canvas>

    <header class="navbar">
        <a href="/home" class="logo" onclick="navigate(event, '/home')">NebulaStream</a>
        <nav class="desktop-nav">
            <a href="/home" onclick="navigate(event, '/home')" class="active">Home</a>
            <a href="/browse" onclick="navigate(event, '/browse')">Browse</a>
            <a href="/trending" onclick="navigate(event, '/trending')">Trending</a>
            <a href="/genres" onclick="navigate(event, '/genres')">Genres</a>
            <a href="/history" onclick="navigate(event, '/history')">History</a>
        </nav>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search anime..." autocomplete="off">
            <div class="search-results" id="search-results"></div>
        </div>
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">☰</button>
    </header>

    <!-- Mobile navigation overlay -->
    <div class="mobile-nav-overlay" id="mobile-nav-overlay">
        <a href="/home" onclick="navigate(event, '/home')" class="active">Home</a>
        <a href="/browse" onclick="navigate(event, '/browse')">Browse</a>
        <a href="/trending" onclick="navigate(event, '/trending')">Trending</a>
        <a href="/genres" onclick="navigate(event, '/genres')">Genres</a>
        <a href="/history" onclick="navigate(event, '/history')">History</a>
    </div>

    <main id="main-content"></main>

    <!-- Player overlay -->
    <div class="player-overlay" id="player-overlay">
        <div class="player-container">
            <button class="close-btn" id="close-player">✖</button>
            <h2 id="player-title"></h2>
            <video id="video-player" controls crossorigin="anonymous"></video>

            <div class="audio-select" id="audio-select" style="display:none;">
                <span style="color:var(--accent-cyan); font-family:'Orbitron',monospace;">Audio:</span>
                <select id="audio-tracks"></select>
            </div>

            <div class="player-controls">
                <div class="lang-select">
                    <button class="lang-btn active" data-lang="sub">🇯🇵 Sub</button>
                    <button class="lang-btn" data-lang="dub">🇬🇧 Dub</button>
                </div>
                <div class="skip-btns" id="skip-btns" style="display:none;">
                    <button class="skip-btn" id="skip-intro">Skip Intro</button>
                    <button class="skip-btn" id="skip-outro">Skip Outro</button>
                </div>
                <div class="ep-nav">
                    <button id="prev-ep">◀ Prev</button>
                    <span id="ep-info"></span>
                    <button id="next-ep">Next ▶</button>
                </div>
            </div>

            <div class="episodes-section">
                <div class="episodes-grid" id="episode-list"></div>
                <div class="episode-page-nav" id="episode-pagination"></div>
            </div>
        </div>
    </div>

    <button id="scroll-top" title="Back to top">⬆</button>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        // ---------- HISTORY‑BASED ROUTER ----------
        function navigate(event, path) {
            event.preventDefault();
            window.history.pushState({}, '', path);
            handleRoute();
        }

        window.addEventListener('popstate', handleRoute);

        function getRouteFromPath() {
            const path = window.location.pathname;
            if (path.startsWith('/anime/')) {
                const parts = path.split('/');
                const id = parts[2];
                const params = new URLSearchParams(window.location.search);
                const autoPlayEp = params.get('ep');
                const seekTime = params.get('time') || '0';
                return { page: 'anime', id, autoPlayEp, seekTime };
            } else if (path.startsWith('/search')) {
                const params = new URLSearchParams(window.location.search);
                const query = params.get('q') || '';
                return { page: 'search', query };
            } else {
                switch (path) {
                    case '/home': return { page: 'home' };
                    case '/browse': return { page: 'browse' };
                    case '/trending': return { page: 'trending' };
                    case '/genres': return { page: 'genres' };
                    case '/history': return { page: 'history' };
                    default: return { page: 'home' };
                }
            }
        }

        async function handleRoute() {
            const route = getRouteFromPath();
            const main = document.getElementById('main-content');
            main.innerHTML = '';

            document.querySelectorAll('.desktop-nav a, .mobile-nav-overlay a').forEach(a => {
                a.classList.remove('active');
                if (a.getAttribute('href') === window.location.pathname) {
                    a.classList.add('active');
                }
            });

            switch (route.page) {
                case 'home': renderHome(); break;
                case 'browse': renderBrowse(); break;
                case 'trending': renderTrending(); break;
                case 'genres': renderGenres(); break;
                case 'history': renderHistory(); break;
                case 'search': renderSearchPage(route.query); break;
                case 'anime': renderAnimeDetails(route.id, route.autoPlayEp ? parseInt(route.autoPlayEp) : null, parseFloat(route.seekTime || '0')); break;
                default: renderHome();
            }
        }

        // ---------- MOBILE NAV TOGGLE ----------
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileNavOverlay = document.getElementById('mobile-nav-overlay');
        mobileMenuBtn.addEventListener('click', () => {
            mobileNavOverlay.classList.toggle('active');
        });
        mobileNavOverlay.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                mobileNavOverlay.classList.remove('active');
            });
        });
        window.addEventListener('popstate', () => {
            mobileNavOverlay.classList.remove('active');
        });

        // ========== GLOBALS ==========
        let hls = null, currentLang = 'sub', currentAnimeId = null;
        let heroSlides = [], heroIndex = 0, heroInterval = null;
        let currentTotalEpisodes = 0;
        let currentEpisodeNum = 1;
        let currentEpisodePage = 0;
        const EPISODES_PER_PAGE = 50;
        let pendingSeekTime = 0;

        const API = {
            async fetchHome() { const r = await fetch('/api/home'); return r.json(); },
            async fetchCatalog(page=1, genre='', sort='TRENDING_DESC') {
                const params = new URLSearchParams({ page, perPage: 30, sort });
                if (genre) params.set('genre', genre);
                const r = await fetch(`/api/catalog?${params}`);
                return r.json();
            },
            async getGenres() { const r = await fetch('/api/genres'); return r.json(); },
            async getEpisodes(id) { const r = await fetch(`/api/episodes/${id}`); return r.json(); },
            async getStream(id, ep) { const r = await fetch(`/stream/${id}/${ep}`); return r.json(); },
            async search(query) {
                const r = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                return r.json();
            },
            async getAnimeDetails(id) {
                const r = await fetch(`/api/anime/${id}`);
                return r.json();
            }
        };

        // ========== SEARCH ==========
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        let searchTimer;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            const query = searchInput.value.trim();
            if (!query) { searchResults.classList.remove('active'); return; }
            searchTimer = setTimeout(async () => {
                const results = await API.search(query);
                searchResults.innerHTML = '';
                results.slice(0, 5).forEach(r => {
                    const div = document.createElement('div');
                    div.className = 'search-result-item';
                    div.innerHTML = `<img src="${r.poster}" loading="lazy" onerror="this.src='https://via.placeholder.com/40x60'"><span>${r.title}</span>`;
                    div.addEventListener('click', () => {
                        window.history.pushState({}, '', `/anime/${r.id}`);
                        handleRoute();
                        searchResults.classList.remove('active');
                        searchInput.value = '';
                    });
                    searchResults.appendChild(div);
                });
                if (results.length > 5) {
                    const more = document.createElement('div');
                    more.className = 'search-result-item';
                    more.style.justifyContent = 'center';
                    more.innerText = 'Show all results…';
                    more.addEventListener('click', () => {
                        window.history.pushState({}, '', `/search?q=${encodeURIComponent(query)}`);
                        handleRoute();
                        searchResults.classList.remove('active');
                        searchInput.value = query;
                    });
                    searchResults.appendChild(more);
                }
                searchResults.classList.add('active');
            }, 400);
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const query = searchInput.value.trim();
                if (query) {
                    window.history.pushState({}, '', `/search?q=${encodeURIComponent(query)}`);
                    handleRoute();
                    searchResults.classList.remove('active');
                }

        function buildHeroSlides(trending) {
            heroSlides = trending.slice(0,5);
            heroIndex = 0;
            renderHeroSlide();
            document.getElementById('hero-dots').innerHTML = heroSlides.map((_,i) => `<span class="hero-dot${i===0?' active':''}" data-index="${i}"></span>`).join('');
            document.getElementById('hero-prev').onclick = () => { heroIndex = (heroIndex - 1 + heroSlides.length) % heroSlides.length; updateHero(); };
            document.getElementById('hero-next').onclick = () => { heroIndex = (heroIndex + 1) % heroSlides.length; updateHero(); };
            document.querySelectorAll('.hero-dot').forEach(d => d.onclick = (e) => { heroIndex = parseInt(e.target.dataset.index); updateHero(); });
            heroInterval = setInterval(() => { heroIndex = (heroIndex + 1) % heroSlides.length; updateHero(); }, 6000);
        }

        function renderHeroSlide() {
            const slide = heroSlides[heroIndex];
            if (!slide) return;
            document.querySelectorAll('.hero-slide').forEach(s => s.remove());
            const slidesContainer = document.createElement('div');
            slidesContainer.className = 'hero-slides';
            heroSlides.forEach((s,i) => {
                const div = document.createElement('div');
                div.className = 'hero-slide' + (i===heroIndex?' active':'');
                div.style.backgroundImage = `url(${s.banner || s.poster})`;
                slidesContainer.appendChild(div);
            });
            document.getElementById('hero').insertBefore(slidesContainer, document.querySelector('.hero-overlay'));
            document.getElementById('hero-title').innerText = slide.title;
            document.getElementById('hero-meta').innerHTML = `<span>★ ${(slide.score/10).toFixed(1)}</span><span>${slide.episodes || 'Airing'}</span><span>${slide.year||''}</span>`;
            document.getElementById('hero-desc').innerText = slide.description?.replace(/<[^>]*>/g, '').substring(0,200)+'...'||'';
        }

        function updateHero() {
            renderHeroSlide();
            document.querySelectorAll('.hero-dot').forEach((d,i) => d.classList.toggle('active',i===heroIndex));
            clearInterval(heroInterval);
            heroInterval = setInterval(() => { heroIndex = (heroIndex + 1) % heroSlides.length; updateHero(); }, 6000);
        }

        function renderRows(data) {
            const rows = [
                { key: 'trending', title: 'Trending Now' },
                { key: 'popular_season', title: 'Popular This Season' },
                { key: 'recent', title: 'Recently Added' },
                { key: 'coming_soon', title: 'Coming Soon' }

            const container = document.getElementById('home-rows');
            rows.forEach(({key, title}) => {

                const section = document.createElement('section');
                section.className = 'row-section';
                section.innerHTML = `<div class="row-header"><h2>${title}</h2></div><div class="scroll-row" id="row-${key}"></div>`;

                list.forEach(a => row.appendChild(createCard(a)));

        function renderEpisodesPagination(anilistId, totalEpisodes, gridContainerId, paginationContainerId, onEpisodeClick) {
            const grid = document.getElementById(gridContainerId);
            const pagContainer = document.getElementById(paginationContainerId);
            if (!grid || !pagContainer) return;

            let currentPage = 0;
            const totalPages = Math.ceil(totalEpisodes / EPISODES_PER_PAGE);

            function renderPage(page) {
                grid.innerHTML = '';
                const start = page * EPISODES_PER_PAGE + 1;
                const end = Math.min(start + EPISODES_PER_PAGE - 1, totalEpisodes);
                for (let i = start; i <= end; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'ep-btn';
                    btn.innerText = i;
                    btn.addEventListener('click', () => onEpisodeClick(i));
                    grid.appendChild(btn);
                }
                pagContainer.innerHTML = '';
                if (totalPages > 1) {
                    if (page > 0) {
                        const prevBtn = document.createElement('button');
                        prevBtn.innerText = '← Previous 50';
                        prevBtn.addEventListener('click', () => { currentPage--; renderPage(currentPage); });
                        pagContainer.appendChild(prevBtn);
                    }
                    if (page < totalPages - 1) {
                        const nextBtn = document.createElement('button');
                        nextBtn.innerText = 'Next 50 →';
                        nextBtn.addEventListener('click', () => { currentPage++; renderPage(currentPage); });
                        pagContainer.appendChild(nextBtn);
                    }
                }
            }
            renderPage(0);
        }

        // ========== HISTORY ==========
        async function renderHistory() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="page-content">
                    <h2>Watch History</h2>
                    <div id="history-actions" style="margin-bottom: 15px;"></div>
                    <div id="history-list" style="display:flex; flex-wrap:wrap; gap:20px; margin-top:20px;"></div>
                </div>
            `;

            const history = JSON.parse(localStorage.getItem('watchHistory') || '{}');
            const entries = Object.entries(history).sort((a, b) => b[1].updatedAt - a[1].updatedAt);

            const container = document.getElementById('history-list');
            const actionsDiv = document.getElementById('history-actions');

            if (entries.length === 0) {
                container.innerHTML = '<p>No watch history yet.</p>';
                return;
            }

            const clearBtn = document.createElement('button');
            clearBtn.className = 'btn btn-secondary';
            clearBtn.innerText = 'Clear History';
            clearBtn.addEventListener('click', () => {
                if (confirm('Are you sure you want to clear your entire watch history?')) {
                    localStorage.removeItem('watchHistory');
                    renderHistory();
                }
            });
            actionsDiv.appendChild(clearBtn);

            container.innerHTML = entries.map(() => `<div class="card" style="height:280px;"></div>`).join('');

            const detailsPromises = entries.map(async ([id, data]) => {
                try {
                    const anime = await API.getAnimeDetails(id);
                    return { id, data, anime };
                } catch (e) {
                    return { id, data, anime: null };
                }
            });
            const results = await Promise.all(detailsPromises);

            container.innerHTML = '';
            results.forEach(({ id, data, anime }) => {
                const progressPercent = Math.round((data.currentTime / data.duration) * 100) || 0;
                const title = anime ? (anime.title.english || anime.title.romaji || 'Unknown') : `Anime ${id}`;
                const poster = anime ? anime.coverImage.large : 'https://via.placeholder.com/300x450?text=?';
                const resumeTime = data.currentTime || 0;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${poster}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450?text=?'">
                    <div class="info">
                        <div class="title">${title}</div>
                        <div class="meta" style="margin-top:4px;">Ep ${data.episode} · ${progressPercent}% watched</div>
                        <div class="progress-bar" style="width:100%; height:3px; background:rgba(255,255,255,0.2); margin-top:6px;">
                            <div style="height:100%; width:${progressPercent}%; background:var(--accent-cyan);"></div>
                        </div>
                        <button class="resume-btn">▶ Resume</button>
                    </div>
                `;

                card.querySelector('.resume-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.history.pushState({}, '', `/anime/${id}?ep=${data.episode}&time=${resumeTime}`);
                    handleRoute();
                });

                card.addEventListener('click', (e) => {
                    if (e.target.closest('.resume-btn')) return;
                    window.history.pushState({}, '', `/anime/${id}`);
                    handleRoute();
                });

                container.appendChild(card);
            });
        }

        // ========== PLAYER ==========
        function openPlayer(anilistId, title, episode = 1, resumeTime = 0) {
            console.log('openPlayer called', anilistId, title, episode, resumeTime);
            currentAnimeId = anilistId;
            pendingSeekTime = resumeTime;
            document.getElementById('player-title').innerText = `${title} - Episode ${episode}`;
            document.getElementById('player-overlay').classList.add('active');

            API.getEpisodes(anilistId).then(data => {
                currentTotalEpisodes = data.total || 12;
                if (currentTotalEpisodes === 0) currentTotalEpisodes = 12;
                currentEpisodeNum = episode;
                currentEpisodePage = Math.floor((episode - 1) / EPISODES_PER_PAGE);
                renderPlayerEpisodes();
                loadStream(anilistId, title, episode);
            }).catch(() => {
                currentTotalEpisodes = 12;
                renderPlayerEpisodes();
                loadStream(anilistId, title, 1);
            });

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
                btn.onclick = () => {
                    currentLang = btn.dataset.lang;
                    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadStream(anilistId, title, currentEpisodeNum);
                };
            });

            document.getElementById('prev-ep').onclick = () => {
                if (currentEpisodeNum > 1) {
                    currentEpisodeNum--;
                    updatePlayerEpisode();
                }
            };
            document.getElementById('next-ep').onclick = () => {
                if (currentEpisodeNum < currentTotalEpisodes) {
                    currentEpisodeNum++;
                    updatePlayerEpisode();
                }
            };
        }

        function renderPlayerEpisodes() {
            const grid = document.getElementById('episode-list');
            const pagContainer = document.getElementById('episode-pagination');
            grid.innerHTML = '';
            const start = currentEpisodePage * EPISODES_PER_PAGE + 1;
            const end = Math.min(start + EPISODES_PER_PAGE - 1, currentTotalEpisodes);
            for (let i = start; i <= end; i++) {
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                btn.innerText = i;
                if (i === currentEpisodeNum) btn.classList.add('active');
                btn.addEventListener('click', () => {
                    currentEpisodeNum = i;
                    updatePlayerEpisode();
                });
                grid.appendChild(btn);
            }
            pagContainer.innerHTML = '';
            const totalPages = Math.ceil(currentTotalEpisodes / EPISODES_PER_PAGE);
            if (totalPages > 1) {
                if (currentEpisodePage > 0) {
                    const prevBtn = document.createElement('button');
                    prevBtn.innerText = '← Previous 50';
                    prevBtn.addEventListener('click', () => {
                        currentEpisodePage--;
                        renderPlayerEpisodes();
                    });
                    pagContainer.appendChild(prevBtn);
                }
                if (currentEpisodePage < totalPages - 1) {
                    const nextBtn = document.createElement('button');
                    nextBtn.innerText = 'Next 50 →';
                    nextBtn.addEventListener('click', () => {
                        currentEpisodePage++;
                        renderPlayerEpisodes();
                    });
                    pagContainer.appendChild(nextBtn);
                }
            }
            document.getElementById('ep-info').innerText = `Ep ${currentEpisodeNum} / ${currentTotalEpisodes}`;
        }

        function updatePlayerEpisode() {
            document.getElementById('player-title').innerText = `${document.getElementById('player-title').innerText.split(' - ')[0]} - Episode ${currentEpisodeNum}`;
            loadStream(currentAnimeId, document.getElementById('player-title').innerText.split(' - ')[0], currentEpisodeNum);
            document.querySelectorAll('#episode-list .ep-btn').forEach(b => {
                b.classList.toggle('active', parseInt(b.innerText) === currentEpisodeNum);
            });
            document.getElementById('ep-info').innerText = `Ep ${currentEpisodeNum} / ${currentTotalEpisodes}`;
            const neededPage = Math.floor((currentEpisodeNum - 1) / EPISODES_PER_PAGE);
            if (neededPage !== currentEpisodePage) {
                currentEpisodePage = neededPage;
                renderPlayerEpisodes();
            }
        }

        function loadStream(anilistId, title, episode) {
            const video = document.getElementById('video-player');
            video.querySelectorAll('track').forEach(t => t.remove());

            API.getStream(anilistId, episode).then(data => {
                console.log('Stream data:', data);
                const stream = data.streams?.find(s => s.name.toLowerCase().includes(currentLang === 'sub' ? 'japanese' : 'english'));
                if (!stream) { alert('No stream'); return; }
                document.getElementById('player-title').innerText = `${title} - Episode ${episode}`;

                if (hls) hls.destroy();

                if (stream.subtitles?.length) {
                    stream.subtitles.forEach(sub => {
                        const track = document.createElement('track');
                        track.kind = 'captions';
                        track.label = sub.lang || 'English';
                        track.srclang = sub.lang || 'en';
                        track.src = sub.url;
                        if (sub.lang === 'English') track.default = true;
                        video.appendChild(track);
                    });
                }

                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(stream.url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.muted = false;
                        if (pendingSeekTime > 0) {
                            video.currentTime = pendingSeekTime;
                            pendingSeekTime = 0;
                        }
                        video.play().catch(() => {});
                    });
                    hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, (event, data) => {
                        const audioSelect = document.getElementById('audio-select');
                        const audioTracksEl = document.getElementById('audio-tracks');
                        if (data.audioTracks.length > 0) {
                            audioSelect.style.display = 'flex';
                            audioTracksEl.innerHTML = '';
                            data.audioTracks.forEach((track, idx) => {
                                const option = document.createElement('option');
                                option.value = idx;
                                option.text = track.lang || track.name || `Track ${idx+1}`;
                                audioTracksEl.appendChild(option);
                            });
                            audioTracksEl.onchange = () => { hls.audioTrack = parseInt(audioTracksEl.value); };
                            hls.audioTrack = 0;
                        } else {
                            audioSelect.style.display = 'none';
                        }
                    });
                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            console.error('HLS fatal error:', data);
                            hls.destroy();
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = stream.url;
                    video.muted = false;
                    if (pendingSeekTime > 0) {
                        video.currentTime = pendingSeekTime;
                        pendingSeekTime = 0;
                    }
                    video.play().catch(() => {});
                }

                const hints = stream.behaviorHints;
                const skipContainer = document.getElementById('skip-btns');
                const skipIntro = document.getElementById('skip-intro');
                const skipOutro = document.getElementById('skip-outro');

                if (hints && (hints.skipIntroTimestamps || hints.skipOutroTimestamps)) {
                    skipContainer.style.display = 'flex';
                    if (hints.skipIntroTimestamps) {
                        skipIntro.style.display = 'inline';
                        skipIntro.onclick = () => { video.currentTime = hints.skipIntroTimestamps[1]; };
                    } else {
                        skipIntro.style.display = 'none';
                    }
                    if (hints.skipOutroTimestamps) {
                        skipOutro.style.display = 'inline';
                        skipOutro.onclick = () => { video.currentTime = hints.skipOutroTimestamps[1]; };
                    } else {
                        skipOutro.style.display = 'none';
                    }
                } else {
                    skipContainer.style.display = 'none';
                }

                const saveProgress = () => {
                    if (video.duration) {
                        const history = JSON.parse(localStorage.getItem('watchHistory') || '{}');
                        history[anilistId] = { episode, currentTime: video.currentTime, duration: video.duration, updatedAt: Date.now() };
                        localStorage.setItem('watchHistory', JSON.stringify(history));
                    }
                };
                video.addEventListener('timeupdate', saveProgress);
            });
        }

        document.getElementById('close-player').addEventListener('click', () => {
            document.getElementById('player-overlay').classList.remove('active');
            if (hls) { hls.destroy(); hls = null; }
        });

        // ========== SCROLL TO TOP ==========
        const scrollBtn = document.getElementById('scroll-top');
        window.addEventListener('scroll', () => {
            scrollBtn.style.display = window.scrollY > 400 ? 'flex' : 'none';
        });
        scrollBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ========== OPTIMIZED FLOATING NEON PARTICLES ==========
        (function() {
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            const MAX_PARTICLES = 20;       // fewer particles
            let mouseX = 0, mouseY = 0;
            let lastFrameTime = 0;
            const FRAME_INTERVAL = 1000 / 30; // 30fps

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function shouldAnimate() {
                return !document.hidden && !document.getElementById('player-overlay').classList.contains('active');
            }

            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * width;
                    this.y = height + 10;
                    this.size = Math.random() * 2 + 1;
                    this.speed = Math.random() * 0.6 + 0.2;
                    this.opacity = Math.random() * 0.4 + 0.1;
                    this.color = Math.random() < 0.5 ? '0,255,255' : '255,0,255';
                    this.wobble = Math.random() * 2;
                }
                update() {
                    this.y -= this.speed;
                    this.x += Math.sin(this.y * 0.02 + this.wobble) * 0.2;
                    if (Math.abs(mouseX - this.x) < 120 && Math.abs(mouseY - this.y) < 120) {
                        this.x += (mouseX - this.x) * 0.001;
                        this.y += (mouseY - this.y) * 0.001;
                    }
                    if (this.y < -10) this.reset();
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;
                    ctx.fill();   // no shadowBlur for performance
                }
            }

            for (let i = 0; i < MAX_PARTICLES; i++) {
                const p = new Particle();
                p.y = Math.random() * height;
                particles.push(p);
            }

            function animate(timestamp) {
                requestAnimationFrame(animate);
                if (!shouldAnimate()) return;

                // Throttle to 30fps
                if (timestamp - lastFrameTime < FRAME_INTERVAL) return;
                lastFrameTime = timestamp;

                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
            }

            requestAnimationFrame(animate);
        })();

        // Initial load
        handleRoute();
    </script>
</body>
</html>
